<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale 제거: 확대를 막으면 저시력 사용자가 글을 읽을 수 없다 (WCAG 1.4.4) -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전승기 강사님의 첫 강의, 잊지 않겠습니다</title>
  <meta name="description" content="전승기 강사님의 첫 강의를 함께한 마음을 남기는 롤링페이퍼" />
  <meta name="theme-color" content="#F8D9E6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="마음 한 장" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- dynamic-subset: unicode-range로 필요한 한글 글리프 조각만 내려받음 (static 대비 초기 로드 대폭 감소) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="hero__label">CONGRATULATIONS</p>
      <h1 class="hero__title">전승기 강사님의 첫 강의<br />잊지 않겠습니다</h1>
      <p class="hero__subtitle">전승기를 만나면 전성기가 옵니다.</p>
      <!-- 사진 파일이 없으면 깨진 이미지 대신 영역 자체를 제거 -->
      <figure class="hero__portrait">
        <img src="lecturer.jpg" alt="전승기 강사님" width="121" height="121"
             onerror="this.closest('.hero__portrait').remove()" />
      </figure>
      <p class="hero__hint">첫 강의를 함께한 마음을 남겨주세요.</p>
      <p class="hero__byline">from. 전성기를 준비하는 사람들</p>
    </header>

    <main>
    <section class="form-card" aria-labelledby="form-title">
      <p class="form-card__label">FROM. 익명의 마음</p>
      <h2 class="form-card__title" id="form-title">감사 메시지 남기기</h2>

      <form id="message-form" novalidate>
        <div class="field">
          <div class="field__row">
            <label for="message">따뜻한 한마디</label>
            <span class="field__hint"><span id="char-count">0</span>/200</span>
          </div>
          <textarea id="message" name="message" placeholder="강사님께 전하고 싶은 말을 남겨주세요..." maxlength="200" rows="4" required></textarea>
          <p class="field__error" id="message-error" role="alert" hidden>메시지를 입력해주세요.</p>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <button type="submit" id="submit-btn">등록하기</button>
        <p class="form-card__notice">욕설·비방·광고성 내용은 등록이 제한됩니다. 등록한 메시지는 카드의 × 버튼을 두 번 눌러 본인만 삭제할 수 있어요.</p>
      </form>
    </section>

    <section class="wall" aria-labelledby="wall-title">
      <div class="wall__header">
        <div>
          <p class="wall__label">TO. 전승기 강사님께</p>
          <h2 class="wall__title" id="wall-title">도착한 마음들</h2>
        </div>
        <span class="wall__count" id="wall-count" aria-live="polite">0개의 마음</span>
      </div>
      <div class="wall__grid" id="wall-grid"></div>
    </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
