<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPL 승부예측 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⚽ EPL 승부예측 게임</h1>
    <p>2024-25 시즌 실제 경기 결과를 예측하고 친구들과 점수를 겨뤄보세요!</p>
  </header>

  <!-- 1. 이름 입력 -->
  <section id="name-section">
    <input id="name-input" type="text" placeholder="이름을 입력하세요" maxlength="10">
    <button id="start-btn">게임 시작</button>
  </section>

  <!-- 2. 경기 예측 (시작 전에는 숨김) -->
  <section id="game-section" class="hidden">
    <h2>경기 결과를 예측하세요 (적중 시 +3점)</h2>
    <p id="progress" class="progress">0 / 20 경기 선택</p>
    <div id="match-list"></div>
    <button id="score-btn" disabled>채점하기</button>
  </section>

  <!-- 3. 결과 + 랭킹 (채점 전에는 숨김) -->
  <section id="result-section" class="hidden">
    <div id="score-box">
      <p class="score-line">내 점수 <strong id="my-score">0</strong> / <span id="max-score">60</span>점</p>
      <p class="score-percent"><span id="my-percent">0</span>% 적중</p>
    </div>

    <h2>경기별 결과</h2>
    <div id="result-detail"></div>

    <h2>🏆 랭킹</h2>
    <table id="ranking-table">
      <thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="retry-btn">다시 하기</button>
  </section>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
