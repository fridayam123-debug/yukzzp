name: Sync Naver Reviews

# 참고: 네이버가 GitHub Actions IP(데이터센터)를 차단하여 cron 예약을 제거함.
# 매일 새벽 4시 동기화는 로컬 PC의 Windows 작업 스케줄러가 수행 (scripts/run-sync.cmd).
on:
  workflow_dispatch:         # 수동 실행 버튼 (디버그용)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run review sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/sync-naver-reviews.ts
